[project]
name = "ask-api"
version = "0.1.0"
description = "Career assistant API: the production streaming app and the exact-answer handler."
requires-python = ">=3.13"
# boto3 is not shipped in the Lambda asset: the function uses the copy in the Python 3.13
# runtime (ADR-009). It stays a development dependency for tests and local Bedrock mode.
dependencies = [
    "anthropic>=1.13.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3>=1.43.105",
    "boto3-stubs[bedrock-runtime]>=1.43.105",
    "botocore[crt]>=1.43.105",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "dev_server.py"]

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
