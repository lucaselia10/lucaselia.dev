# Verification only. This workflow does not deploy AWS resources.
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm and Node.js 24
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19"
          python-version: "3.13"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python 3.13 and backend dependencies
        run: |
          uv python install 3.13
          uv sync --frozen --all-groups --directory services/ask-api

      - name: Check public safety
        run: pnpm check:public

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate content
        run: pnpm validate:content

      - name: Build the site
        run: pnpm build

      - name: Synthesize CDK
        run: pnpm synth
